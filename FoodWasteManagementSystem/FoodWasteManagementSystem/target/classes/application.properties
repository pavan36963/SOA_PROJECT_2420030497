spring.application.name=food-waste-management
server.port=8080

# Default: H2 in-memory database, so the project runs without installing MySQL.
# Data resets whenever the application is restarted.
spring.datasource.url=jdbc:h2:mem:foodwaste;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# To use MySQL instead, comment out the H2 datasource lines above and uncomment below:
# spring.datasource.url=jdbc:mysql://localhost:3306/food_waste_db
# spring.datasource.username=root
# spring.datasource.password=YOUR_MYSQL_PASSWORD
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.hibernate.ddl-auto=update
